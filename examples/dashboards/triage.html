<!doctype html>
<!--
  gadak triage dashboard (GDK-781 example, upgraded GDK-792/793).

  Register it:

    gadak dashboards save triage --html examples/dashboards/triage.html \
      --datasource by_status=sql:select\ status_category,\ count(*)\ as\ n\ from\ issues_full\ group\ by\ 1\ order\ by\ 1 \
      --datasource top_open=sql:select\ key,\ priority_rank,\ summary\ from\ issues_full\ where\ status_category\ !=\ 'done'\ order\ by\ priority_rank,\ updated_at\ desc\ limit\ 8 \
      --datasource monthly_opened=sql:select\ strftime('%s',\ substr(created_at,\ 1,\ 7)\ ||\ '-01')\ as\ t,\ count(*)\ as\ n\ from\ issues_full\ where\ created_at\ >=\ date('now',\ '-11\ months')\ group\ by\ 1\ order\ by\ 1 \
      --datasource mine=jql:assignee\ =\ currentUser()\ AND\ resolution\ is\ EMPTY

  Open it:

    gadak dashboards open triage

  Contract: this document runs no queries of its own. The serving page runs
  the datasources (GET /api/v1/dashboards/{id}/data/{name}/) and posts each
  result in as

    {type: 'data', name: '<datasource name>', columns: [...], rows: [[...]],
     truncated: bool, warning?: string}

  and re-pushes them when the mirror moves (15s poll) or when this document
  asks — the Refresh button posts {type: 'refresh'}. Links out of the wall
  come in the two shapes the frame→parent whitelist allows (plus one the
  sandbox allows on its own):

    parent.postMessage({type: 'open', hash: '#/?issue=GDK-1'}, '*')   → the app navigates itself: issue detail
    parent.postMessage({type: 'open', hash: '#/?sc=inprogress'}, '*') → filtered list (status category)
    <a href="https://…" target="_blank" rel="noopener">…</a>          → a new tab, on click

  The `open` hash is always a `#/…` fragment of the app's own grammar —
  docs/DASHBOARDS.md has the recipe table (views, search, filters included).

  The chart library is vendored, not fetched from a CDN: uPlot is served by
  the same origin at /api/v1/dashboards/vendor/ (GDK-792). Leading slash on
  purpose — this document's base URL is /api/v1/dashboards/<id>/render/, so
  a relative URL would misresolve.

  Column lookup is by name, never by position. Mirror text (summaries,
  statuses) is inserted via textContent only — this page builds no markup
  out of row data.

  Colors come from this document's own CSS custom properties — nothing is
  inherited from the host page. The frame is sandboxed to an opaque origin
  (no allow-same-origin), so it cannot see the app's data-theme attribute;
  the one theme axis it can follow is the OS scheme, which is also the
  app's own default (light base in web/src/app.css, dark under
  prefers-color-scheme). Light below converges on the app's light tokens,
  and the dark block is the pre-GDK-1082 dark palette, byte for byte.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Triage</title>
<link rel="stylesheet" href="/api/v1/dashboards/vendor/uPlot.min.css">
<script src="/api/v1/dashboards/vendor/uPlot.iife.min.js"></script>
<style>
  /*
    Theme axis (GDK-1082): light is the base, dark rides the media query —
    the same direction the app shell uses (web/src/app.css keeps light in
    @theme and redefines the same properties under
    prefers-color-scheme: dark). Light values converge on the app's light
    tokens (app.css @theme); the dark block is this wall's pre-GDK-1082
    dark palette, unchanged.
  */
  :root {
    color-scheme: light;
    --bg: #f4efe4;         /* app --color-bg-base — the surface the wall sits on */
    --surface: #e4d9c4;    /* app --color-bg-elevated — cards, panels */
    --border: #d5c9b2;     /* app --color-border-subtle */
    --line: #d5c9b2;       /* hairline dividers + chart grid */
    --ink: #1c1812;        /* app --color-text-primary */
    --muted: #635a4f;      /* app --color-text-muted (≈4.8:1 on elevated) */
    --accent: #2e4560;     /* app --color-accent (쪽빛) — links, hover */
    --new: #2f5d8c;        /* app --color-status-new */
    --inprogress: #7e5904; /* app --color-status-inprogress */
    --done: #1c4c31;       /* app --color-status-done */
    --reopen: #8f3530;     /* app --color-status-reopen — the P-rank chips */
    --rank-line: #edd8d4;  /* app --color-lozenge-red — behind --reopen */
    --series-fill: rgba(47, 93, 140, 0.12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #0d1017;
      --surface: #161b26;
      --border: #232a3a;
      --line: #1d2331;
      --ink: #e8ecf4;
      --muted: #8b94a7;
      --accent: #7aa2f7;
      --new: #7aa2f7;
      --inprogress: #e0af68;
      --done: #9ece6a;
      --reopen: #f7768e;
      --rank-line: #3a2a33;
      --series-fill: rgba(122, 162, 247, 0.12);
    }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 20px 22px 26px;
  }
  header { display: flex; align-items: baseline; gap: 14px; margin-bottom: 16px; }
  h1 { font-size: 19px; font-weight: 650; letter-spacing: 0.2px; color: var(--ink); }
  .sub { color: var(--muted); font-size: 12.5px; }
  .cards { display: grid; grid-template-columns: repeat(4, minmax(120px, 1fr)); gap: 12px; margin-bottom: 18px; }
  /* Cards are buttons (the count is a link into the app's filtered list), so
     the reset is explicit: buttons bring their own font, color, and centering. */
  .card {
    display: block; width: 100%; text-align: left; font: inherit; color: inherit;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px 10px; cursor: pointer;
  }
  .card:hover { border-color: var(--accent); }
  .card .n, .card .label { display: block; }
  .card .n { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .card .label { color: var(--muted); font-size: 12px; margin-top: 2px; letter-spacing: 0.4px; text-transform: uppercase; }
  .card.new .n { color: var(--new); }
  .card.inprogress .n { color: var(--inprogress); }
  .card.done .n { color: var(--done); }
  .card.total .n { color: var(--ink); }
  /* Tracks stay minmax(0, …), never bare fr: a bare fr track floors at its
     content's min-content, so a wide child inflates its track and the grid
     overflows the frame — measured GDK-1053: the nowrap row summaries pushed
     both tracks to [656.8px 763.2px] while the frame was 1168px/1008px wide,
     and the right card exited the viewport with no scrollbar to reach it.
     Measured GDK-1080: this rule has to hold in the narrow media too. The
     override below used to say bare `1fr` (= minmax(auto, 1fr)), whose min
     track sizing function is the content's min-content — the uPlot canvas,
     init-sized from a host read before layout settled, floored the track at
     761px inside a 528px frame (clientWidth 528, scrollWidth 785). */
  main { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 12px; align-items: start; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  /* A title never hard-clips mid-word (GDK-1080): a panel too narrow for
     its title ellipsizes instead. */
  .panel h2 {
    font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: 0.6px;
    text-transform: uppercase; margin-bottom: 10px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .row { display: flex; gap: 10px; align-items: baseline; padding: 5px 0; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; }
  .key { color: var(--accent); font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px; white-space: nowrap; }
  /* An issue-key chip that navigates the app (open verb). Same ink as .key,
     button reset on top. */
  .key-btn {
    background: none; border: 0; padding: 0; cursor: pointer; font: inherit;
    text-decoration: underline; text-underline-offset: 3px;
  }
  .key-btn:hover { color: var(--ink); }
  .ext {
    margin-left: auto; color: var(--muted); font-size: 12.5px; text-decoration: none;
    border-bottom: 1px solid var(--border);
  }
  .ext:hover { color: var(--ink); border-color: var(--accent); }
  .summary { color: var(--ink); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank {
    color: var(--reopen); font-size: 11px; font-weight: 700; border: 1px solid var(--rank-line);
    border-radius: 5px; padding: 0 5px; white-space: nowrap;
  }
  .rank.r4, .rank.r5 { color: var(--muted); border-color: var(--border); }
  .mine .key { color: var(--inprogress); }
  .foot { color: var(--muted); font-size: 12px; margin-top: 14px; }
  .warn { color: var(--inprogress); }
  .empty { color: var(--muted); font-style: italic; }
  svg text { fill: var(--muted); font-size: 11px; }
  /* The chart panel spans both columns: a trend reads across time, and the
     two-column area above it is about right now. */
  .chart-panel { grid-column: 1 / -1; }
  .chart-panel .u-legend { display: none; }
  .chart-panel .u-axis text { fill: var(--muted); font-size: 11px; }
  /* The canvas is sized in px from its host at init and on resize; this cap
     is the belt over that: if a sizing race ever makes it wider than the
     panel, it degrades to the panel width instead of forcing the grid wide
     (GDK-1053). */
  #monthly canvas { max-width: 100%; }
  #refresh {
    background: var(--surface); color: var(--ink); border: 1px solid var(--border);
    border-radius: 7px; padding: 4px 12px; font: inherit; font-size: 12.5px; cursor: pointer;
  }
  #refresh:hover { border-color: var(--accent); }
  @media (max-width: 960px) {
    main { grid-template-columns: minmax(0, 1fr); }
    .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
</style>
</head>
<body>
  <header>
    <h1>Triage</h1>
    <span class="sub" id="stamp">waiting for data…</span>
    <!-- The sandbox's popup grants carry this one: a click-gestured
         target="_blank" opens a real new tab (rel="noopener" keeps the tab
         from referencing this frame back). The wall itself stays put —
         never point a plain href at the outside; that navigates the frame
         and replaces this document. -->
    <a class="ext" href="https://github.com/midagedev/gadak/blob/main/docs/DASHBOARDS.md" target="_blank" rel="noopener noreferrer">contract&nbsp;↗</a>
    <!-- The other frame→parent verb: ask the host to re-run the datasources.
         No URL, no navigation, no payload — the whitelist in the serving
         page accepts exactly this shape and nothing else. -->
    <button id="refresh" type="button">Refresh</button>
  </header>

  <!-- Each card is an `open` link into the app's filtered list (data-sc is
       the status_category value, or a comma list for the open-count card). -->
  <section class="cards" aria-label="counts">
    <button class="card new" type="button" data-sc="new"><span class="n" id="n-new">–</span><span class="label">to do</span></button>
    <button class="card inprogress" type="button" data-sc="inprogress"><span class="n" id="n-inprogress">–</span><span class="label">in progress</span></button>
    <button class="card done" type="button" data-sc="done"><span class="n" id="n-done">–</span><span class="label">done</span></button>
    <button class="card total" type="button" data-sc="new,inprogress"><span class="n" id="n-open">–</span><span class="label">open (to do + in progress)</span></button>
  </section>

  <main>
    <div class="panel">
      <h2>Top open by priority</h2>
      <div id="top"><div class="empty">no rows</div></div>
    </div>
    <div class="panel">
      <h2>Open by status</h2>
      <div id="bars"><div class="empty">no rows</div></div>
      <h2 style="margin-top:16px">Mine (open)</h2>
      <div id="mine" class="mine"><div class="empty">no rows</div></div>
    </div>
    <div class="panel chart-panel">
      <h2>Opened per month (12 months)</h2>
      <div id="monthly"><div class="empty">no rows</div></div>
    </div>
  </main>

  <div class="foot" id="foot"></div>

<script>
'use strict';
// Datasource results by name, as posted by the serving page.
var results = {};

function col(res, name) {
  var i = res.columns.indexOf(name);
  return i < 0 ? null : i;
}

function setText(id, text) {
  var el = document.getElementById(id);
  if (el) el.textContent = text;
}

function renderCounts(res) {
  var cCat = col(res, 'status_category'), cN = col(res, 'n');
  if (cCat === null || cN === null) return;
  var counts = {};
  for (var i = 0; i < res.rows.length; i++) {
    counts[res.rows[i][cCat]] = Number(res.rows[i][cN]) || 0;
  }
  setText('n-new', String(counts['new'] || 0));
  setText('n-inprogress', String(counts['inprogress'] || 0));
  setText('n-done', String(counts['done'] || 0));
  setText('n-open', String((counts['new'] || 0) + (counts['inprogress'] || 0)));
}

function renderTop(res) {
  var host = document.getElementById('top');
  host.textContent = '';
  var cKey = col(res, 'key'), cRank = col(res, 'priority_rank'), cSum = col(res, 'summary');
  if (cKey === null || cRank === null || cSum === null || res.rows.length === 0) {
    host.appendChild(el('div', 'empty', 'no rows'));
    return;
  }
  for (var i = 0; i < res.rows.length; i++) {
    var r = res.rows[i];
    var row = el('div', 'row');
    row.appendChild(keyBtn(String(r[cKey])));
    var rank = el('span', 'rank r' + r[cRank], 'P' + r[cRank]);
    row.appendChild(rank);
    row.appendChild(el('span', 'summary', String(r[cSum])));
    host.appendChild(row);
  }
}

// Hand-rolled horizontal bars: three rects with width proportional to count,
// labels set as SVG text — no chart library, no image, no fetch.
function renderBars(res) {
  var host = document.getElementById('bars');
  host.textContent = '';
  var cCat = col(res, 'status_category'), cN = col(res, 'n');
  if (cCat === null || cN === null || res.rows.length === 0) {
    host.appendChild(el('div', 'empty', 'no rows'));
    return;
  }
  var NS = 'http://www.w3.org/2000/svg';
  // valRoom reserves the value label's width inside the viewBox: the longest
  // bar's label sits at pad + barWidth + 6, so bars must scale to the space
  // left of that or the label lands past W and clips (GDK-1068).
  var W = 320, rowH = 26, pad = 74, valRoom = 34;
  var max = 1;
  var cats = ['new', 'inprogress', 'done'];
  var counts = {};
  for (var i = 0; i < res.rows.length; i++) counts[res.rows[i][cCat]] = Number(res.rows[i][cN]) || 0;
  for (i = 0; i < cats.length; i++) max = Math.max(max, counts[cats[i]] || 0);
  var svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('width', '100%');
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + (cats.length * rowH));
  svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', 'open issues by status category');
  var fills = { new: cssVar('--new'), inprogress: cssVar('--inprogress'), done: cssVar('--done') };
  var names = { new: 'to do', inprogress: 'in progress', done: 'done' };
  for (i = 0; i < cats.length; i++) {
    var cat = cats[i], n = counts[cat] || 0, y = i * rowH;
    var label = document.createElementNS(NS, 'text');
    label.setAttribute('x', 0); label.setAttribute('y', y + 16);
    label.textContent = names[cat];
    svg.appendChild(label);
    var rect = document.createElementNS(NS, 'rect');
    rect.setAttribute('x', pad); rect.setAttribute('y', y + 4);
    rect.setAttribute('width', Math.round((W - pad - valRoom) * n / max));
    rect.setAttribute('height', 14); rect.setAttribute('rx', 3);
    rect.setAttribute('fill', fills[cat]);
    svg.appendChild(rect);
    var val = document.createElementNS(NS, 'text');
    val.setAttribute('x', pad + Math.round((W - pad - valRoom) * n / max) + 6);
    val.setAttribute('y', y + 16);
    val.textContent = String(n);
    svg.appendChild(val);
  }
  host.appendChild(svg);
}

function renderMine(res) {
  var host = document.getElementById('mine');
  host.textContent = '';
  var cKey = col(res, 'issue_key'), cSum = col(res, 'summary'), cStatus = col(res, 'status');
  if (cKey === null || cSum === null || res.rows.length === 0) {
    host.appendChild(el('div', 'empty', 'no rows'));
    return;
  }
  for (var i = 0; i < res.rows.length; i++) {
    var r = res.rows[i];
    var row = el('div', 'row');
    row.appendChild(keyBtn(String(r[cKey])));
    var what = r[cSum] + (cStatus === null ? '' : ' · ' + r[cStatus]);
    row.appendChild(el('span', 'summary', what));
    host.appendChild(row);
  }
}

// uPlot chart from the monthly_opened datasource (GDK-792 vendor recipe).
// x values are unix seconds straight out of strftime('%s', …) — uPlot's
// default x scale is seconds, so no client-side parsing happens. One
// instance per document; later pushes go through setData, not re-init.
//
// The singleton is the whole discipline: render() re-runs on every message
// (any datasource landing), so clearing the host unconditionally would
// destroy the live chart's DOM and leave `chart` pointing at it — the next
// push would setData into a dead chart and silently blank the panel. DOM is
// cleared only on paths that rebuild, and the empty-rows path destroys the
// instance so a later real push re-creates it.
var chart = null;
function renderMonthly(res) {
  var host = document.getElementById('monthly');
  var cT = col(res, 't'), cN = col(res, 'n');
  var empty = function (msg) {
    if (chart) { chart.destroy(); chart = null; }
    host.textContent = '';
    host.appendChild(el('div', 'empty', msg));
  };
  if (typeof uPlot === 'undefined') {
    empty('uPlot did not load from the vendor route');
    return;
  }
  if (cT === null || cN === null || res.rows.length === 0) {
    empty('no rows');
    return;
  }
  var x = [], y = [];
  for (var i = 0; i < res.rows.length; i++) {
    x.push(Number(res.rows[i][cT]));
    y.push(Number(res.rows[i][cN]) || 0);
  }
  var data = [x, y];
  if (chart) { chart.setData(data); return; }
  host.textContent = '';
  chart = new uPlot({
    width: Math.max(280, host.clientWidth - 2 || 560),
    height: 150,
    cursor: { show: false },
    legend: { show: false },
    grid: { stroke: cssVar('--line') },
    axes: [
      { stroke: cssVar('--muted'), grid: { show: false } },
      { stroke: cssVar('--muted'), grid: { show: true, stroke: cssVar('--line') } },
    ],
    series: [
      {},
      {
        stroke: cssVar('--new'), width: 2,
        points: { show: true, size: 4, stroke: cssVar('--new'), fill: cssVar('--bg') },
        fill: cssVar('--series-fill'),
      },
    ],
  }, data, host);
}

var resizeTimer = null;
window.addEventListener('resize', function () {
  if (!chart || resizeTimer) return;
  resizeTimer = setTimeout(function () {
    resizeTimer = null;
    var host = document.getElementById('monthly');
    if (host && host.clientWidth) chart.setSize({ width: Math.max(280, host.clientWidth - 2), height: 150 });
  }, 100);
});

// One theme token, resolved at call time. The palette lives in CSS custom
// properties (GDK-1082); the bars and the chart bake colors when they render,
// so they read the properties instead of holding literal copies of them.
function cssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

// A live OS-scheme flip re-themes every CSS surface for free — the chart is
// the one surface whose colors are baked into a canvas at init, so it is
// rebuilt, and the bars re-read their ink. Both re-renders are the same
// paths a datasource push already takes.
var schemeQuery = window.matchMedia('(prefers-color-scheme: dark)');
function onSchemeChange() {
  if (results.by_status) renderBars(results.by_status);
  if (!results.monthly_opened) return;
  if (chart) { chart.destroy(); chart = null; }
  renderMonthly(results.monthly_opened);
}
if (schemeQuery.addEventListener) schemeQuery.addEventListener('change', onSchemeChange);
else if (schemeQuery.addListener) schemeQuery.addListener(onSchemeChange);

function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

// An issue-key chip that navigates the app via the open verb. Mirror text is
// still textContent-only; data-key carries the key, never markup.
function keyBtn(key) {
  var b = el('button', 'key key-btn', key);
  b.type = 'button';
  b.setAttribute('data-key', key);
  return b;
}

function render() {
  if (results.by_status) renderCounts(results.by_status);
  if (results.by_status) renderBars(results.by_status);
  if (results.top_open) renderTop(results.top_open);
  if (results.mine) renderMine(results.mine);
  if (results.monthly_opened) renderMonthly(results.monthly_opened);

  var stamp = [], foot = [];
  var names = ['by_status', 'top_open', 'mine', 'monthly_opened'];
  for (var i = 0; i < names.length; i++) {
    var r = results[names[i]];
    if (!r) continue;
    if (r.warning) foot.push(names[i] + ': ' + r.warning);
    if (r.truncated) foot.push(names[i] + ': result truncated');
  }
  var got = names.filter(function (n) { return results[n]; }).length;
  setText('stamp', got === 0 ? 'waiting for data…' : got + '/' + names.length + ' datasources');
  var footEl = document.getElementById('foot');
  footEl.textContent = '';
  for (i = 0; i < foot.length; i++) {
    var line = el('div', 'warn', foot[i]);
    footEl.appendChild(line);
  }
}

window.addEventListener('message', function (ev) {
  var d = ev.data;
  if (!d || d.type !== 'data' || typeof d.name !== 'string') return;
  results[d.name] = { columns: d.columns || [], rows: d.rows || [], truncated: !!d.truncated, warning: d.warning || '' };
  render();
});

// Frame→parent verbs (GDK-793): '*' because this document is
// sandboxed to an opaque origin and cannot name the parent — the payloads
// are bare verbs, and the parent filters by message source anyway.
document.getElementById('refresh').addEventListener('click', function () {
  parent.postMessage({ type: 'refresh' }, '*');
});

// The open verb: hand the parent a `#/…` hash and it navigates the app
// itself. A fragment is same-document by construction — the wall cannot
// aim the app at an outside URL through this channel. To leave the app,
// use a plain <a target="_blank" rel="noopener"> (the contract link in
// the header): the click gesture opens a real new tab.
function openInApp(hash) {
  parent.postMessage({ type: 'open', hash: hash }, '*');
}

// One delegated listener for every navigating element: status cards go to
// a category-filtered list, key chips go to the issue itself.
document.addEventListener('click', function (ev) {
  var card = ev.target.closest('.card[data-sc]');
  if (card) {
    openInApp('#/?sc=' + card.getAttribute('data-sc'));
    return;
  }
  var chip = ev.target.closest('.key-btn');
  if (chip) openInApp('#/?issue=' + chip.getAttribute('data-key'));
});

render();
</script>
</body>
</html>
