# GoReleaser config for scry.
# The web UI is compiled into the binary via go:embed (embed.go), so a release
# archive is one self-contained binary. The release workflow runs `npm run
# build` before goreleaser so dist/app is present at compile time.
#
# Signing: checksums.txt only. Cosign / sigstore attestation is deferred
# (uncomment and wire GITHUB_TOKEN + OIDC when we need keyless signatures).

version: 2

project_name: scry

# Release artifacts go to .release/, not dist/: `--clean` empties the output
# directory, and dist/app holds the web build that go:embed needs at compile
# time. Sharing the directory means --clean deletes the UI before the build.
dist: .release

before:
  hooks:
    - go mod tidy
    # Web UI must already be built (release workflow runs npm run build first).
    - test -d dist/app

builds:
  - id: scry
    main: ./cmd/scry
    binary: scry
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}
    flags:
      - -trimpath

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    files:
      - LICENSE
      - NOTICE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Homebrew tap formula. Requires a separate repo midagedev/homebrew-tap and a
# token with contents:write on that repo (HOMEBREW_TAP_GITHUB_TOKEN in the
# release workflow). Formula is still written under .release/ when upload is
# skipped. Note: `brews` is deprecated upstream in favor of homebrew_casks;
# we keep formulas until the tap is ready for casks.
brews:
  - name: scry
    ids:
      - default
    repository:
      owner: midagedev
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/midagedev/scry"
    description: "Local SQLite mirror of your Jira issues — web UI, TUI, and agent SQL"
    license: "Apache-2.0"
    commit_msg_template: "scry {{ .Tag }}"
    # No tap token, no formula push — a release must not fail because the
    # optional Homebrew step has no credential. With a token: still skipped for
    # prerelease tags (v0.1.0-rc.1, etc.).
    skip_upload: '{{ if .Env.HOMEBREW_TAP_GITHUB_TOKEN }}auto{{ else }}true{{ end }}'
    test: |
      system "#{bin}/scry", "version"
    install: |
      bin.install "scry"

# Cosign / sbom / notarize: skipped for now (checksums.txt is the only artifact
# integrity signal). Revisit before a public v1.

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: midagedev
    name: scry
  draft: false
  prerelease: auto
  name_template: "scry {{.Tag}}"
  footer: |
    ## Install

    After the first public release:

    ```bash
    brew install midagedev/tap/scry
    # or
    curl -fsSL https://raw.githubusercontent.com/midagedev/scry/main/scripts/install.sh | sh
    ```

    Or download the archive for your OS/arch from this release, unpack it, and run:

    ```bash
    ./scry init && ./scry serve --sync
    ```

    The web UI is embedded — the binary is the whole install. See the README for Docker and source builds.
