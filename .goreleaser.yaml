# GoReleaser config for gadak.
# The web UI is compiled into the binary via go:embed (embed.go), so a release
# archive is one self-contained binary. The release workflow runs `npm run
# build` before goreleaser so dist/app is present at compile time.
#
# Signing: checksums.txt only. Cosign / sigstore attestation is deferred
# (uncomment and wire GITHUB_TOKEN + OIDC when we need keyless signatures).

version: 2

project_name: gadak

# Release artifacts go to .release/, not dist/: `--clean` empties the output
# directory, and dist/app holds the web build that go:embed needs at compile
# time. Sharing the directory means --clean deletes the UI before the build.
dist: .release

before:
  hooks:
    - go mod tidy
    # Web UI must already be built (release workflow runs npm run build first).
    - test -d dist/app

builds:
  - id: gadak
    main: ./cmd/gadak
    binary: gadak
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}
    flags:
      - -trimpath

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    files:
      - LICENSE
      - NOTICE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Homebrew tap formula. Pushed to midagedev/homebrew-tap over SSH with a
# write-scoped deploy key (TAP_DEPLOY_KEY secret in the release workflow) —
# no PAT involved, the key opens exactly one repo. Formula is still written
# under .release/ when upload is skipped. Note: `brews` is deprecated upstream
# in favor of homebrew_casks; we keep formulas until the tap is ready for casks.
# macOS signing + notarization. Without it a browser-downloaded archive carries
# com.apple.quarantine and Gatekeeper refuses to run the binary; curl and brew
# do not set that attribute, which is why those paths worked unsigned.
#
# Enabled only when the secrets are present, so a fork's tag still builds.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      sign:
        certificate: "{{.Env.MACOS_SIGN_P12}}"
        password: "{{.Env.MACOS_SIGN_PASSWORD}}"
      notarize:
        issuer_id: "{{.Env.MACOS_NOTARY_ISSUER_ID}}"
        key_id: "{{.Env.MACOS_NOTARY_KEY_ID}}"
        key: "{{.Env.MACOS_NOTARY_KEY}}"
        # A bare executable cannot be stapled, so the ticket stays on Apple's
        # side and Gatekeeper checks it online. Waiting keeps a failed
        # notarization from shipping as a green release.
        wait: true
        timeout: 20m

# GoReleaser deprecates `brews` in favour of `homebrew_casks`, but a cask is the
# wrong shape here until the binaries are notarized: Homebrew stamps cask
# downloads with com.apple.quarantine and Gatekeeper refuses to run an unsigned
# Mach-O carrying it. Verified on a formula install — the installed binary has
# only com.apple.provenance, and `brew test` passes. A formula also covers Linux,
# which casks do not. Revisit when signing/notarization lands.
brews:
  - name: gadak
    ids:
      - default
    repository:
      owner: midagedev
      name: homebrew-tap
      git:
        url: "git@github.com:midagedev/homebrew-tap.git"
        private_key: '{{ .Env.TAP_DEPLOY_KEY }}'
    directory: Formula
    homepage: "https://github.com/midagedev/gadak"
    description: "Local SQLite mirror of your Jira issues — web UI and agent SQL"
    license: "Apache-2.0"
    commit_msg_template: "gadak {{ .Tag }}"
    # No deploy key, no formula push — a release must not fail because the
    # optional Homebrew step has no credential (forks). With the key: still
    # skipped for prerelease tags (v0.1.0-rc.1, etc.).
    skip_upload: '{{ if isEnvSet "TAP_DEPLOY_KEY" }}auto{{ else }}true{{ end }}'
    test: |
      system "#{bin}/gadak", "version"
    install: |
      bin.install "gadak"

# Cosign / sbom / notarize: skipped for now (checksums.txt is the only artifact
# integrity signal). Revisit before a public v1.

changelog:
  sort: asc
  # Grouped, human-first changelog. The curated summary still gets written by
  # hand on the release page; this keeps the generated tail readable.
  groups:
    - title: Features
      regexp: '^feat'
      order: 0
    - title: Fixes
      regexp: '^fix'
      order: 1
    - title: Performance
      regexp: '^perf'
      order: 2
    - title: Other
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: midagedev
    name: gadak
  draft: false
  prerelease: auto
  name_template: "gadak {{.Tag}}"
  footer: |
    ## Install / upgrade

    ```bash
    brew install midagedev/tap/gadak     # first install
    brew upgrade midagedev/tap/gadak     # upgrade
    # or
    curl -fsSL https://raw.githubusercontent.com/midagedev/gadak/main/scripts/install.sh | sh
    ```

    Or download the archive for your OS/arch from this release, unpack it, and run:

    ```bash
    ./gadak init && ./gadak serve --sync
    ```

    The web UI is embedded — the binary is the whole install. See the README for Docker and source builds. Running installs notice new releases on their own (daily anonymous check, `updateCheck: false` to opt out — see SECURITY.md).
