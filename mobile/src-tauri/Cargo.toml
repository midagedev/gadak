[package]
name = "gadak-mobile"
version = "0.1.0"
description = "gadak mobile companion (GDK-796)"
edition = "2021"

# Default create-tauri-app v2 shape: the lib target is what iOS/Android build,
# main.rs is the desktop entry. No plugins are pulled in — the app makes
# exactly one kind of network request (the configured serve endpoint), from
# the webview, so no Rust-side HTTP dependency is needed in this round.
[lib]
name = "gadak_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
