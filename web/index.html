<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Not a mobile app: phones get the desktop layout scaled to fit instead
         of a squeezed column. 1100 matches the layout's comfortable minimum. -->
    <meta name="viewport" content="width=1100" />
    <meta name="theme-color" content="#ebe3d2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131417" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./icon-16.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>gadak</title>
    <!--
      저장된 테마 선택을 첫 페인트 전에 적용한다. 모듈 스크립트(main.ts)는
      번들을 받은 뒤에야 실행되므로, 다크 사용자가 매 부팅마다 크림색 셸을
      한 번 보게 된다 — 그 창을 닫는 것이 이 블로킹 스크립트다.
      키는 web/src/lib/storage.ts의 themeStorageKeyFromPath와 같아야 하고
      (/w/<name>이면 gadak:theme:<name>, 아니면 gadak:theme),
      web/src/lib/boot-theme.test.ts가 손 철자와 경로 파생이 갈라지면 실패한다.
    -->
    <script>
      try {
        var m = location.pathname.match(/^\/w\/([A-Za-z0-9_-]+)(\/|$)/)
        var key = m ? 'gadak:theme:' + m[1] : 'gadak:theme'
        var p = localStorage.getItem(key)
        if (['light', 'dark', 'ink', 'ember'].indexOf(p) >= 0) {
          document.documentElement.setAttribute('data-theme', p)
        }
      } catch (e) {
        /* private mode: OS 설정을 따른다 */
      }
    </script>
    <!--
      사용자 색 오버라이드도 같은 창을 닫는다(GDK-786). 모듈 번들이 도착한
      뒤 applyUserTokens()가 서버 문서로 교정하지만, 그 전 몇 프레임은
      이 캐시가 그린다. 키/정규식은 web/src/lib/user-tokens.ts의 상수와
      손 철자로 일치해야 하고(테마와 같은 /w/<name> 파생 규칙),
      user-tokens.test.ts가 갈라지면 실패한다. 값은 이미 서버가 hex로
      걸렀지만 여기서도 var/hex를 재검사한다 — 손으로 고친 config.json과
      다운그레이드가 부팅을 깨지 않는 벨트다.
    -->
    <script>
      try {
        var mu = location.pathname.match(/^\/w\/([A-Za-z0-9_-]+)(\/|$)/)
        var ukey = mu ? 'gadak:user-tokens:' + mu[1] : 'gadak:user-tokens'
        var udoc = JSON.parse(localStorage.getItem(ukey) || 'null')
        var vars = udoc && udoc.vars
        if (vars && typeof vars === 'object') {
          var decl = function (m) {
            if (!m || typeof m !== 'object') return ''
            var out = []
            for (var k in m) {
              if (/^--color-[a-z0-9-]+$/i.test(k) && /^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(m[k])) {
                out.push(k + ':' + m[k] + ';')
              }
            }
            return out.join('')
          }
          var ucss = ''
          var ulight = decl(vars.light)
          if (ulight) ucss += ':root{' + ulight + '}'
          for (var pal in vars) {
            if (pal === 'light' || !/^[a-z0-9-]{1,32}$/.test(pal)) continue
            var pd = decl(vars[pal])
            if (pd) ucss += ":root[data-theme='" + pal + "']{" + pd + '}'
          }
          var udark = decl(vars.dark)
          if (udark) ucss += "@media (prefers-color-scheme: dark){:root:not([data-theme='light']){" + udark + '}}'
          if (ucss) {
            var us = document.createElement('style')
            us.setAttribute('data-gadak-user-tokens', '')
            us.textContent = ucss
            document.head.appendChild(us)
          }
        }
      } catch (e) {
        /* private mode / 손상된 캐시: app.css 기본 팔레트 */
      }
    </script>
    <!--
      인라인 크리티컬 CSS (Linear 식 inlined app shell).
      번들/스타일 로드 전에도 지면과 스켈레톤이 즉시 페인트되어
      플래시(FOUC) 없이 부팅한다. 색의 단일 소유자는 app.css의 토큰이다 —
      아래 --boot-* 는 번들 CSS가 도착하기 전 몇 프레임 동안만 쓰이는
      폴백이고, 도착하는 즉시 var(--color-*)가 이긴다. 그래서 이 규칙이
      unlayered여도 app.css의 @layer 규칙을 덮어쓰지 않는다.
    -->
    <style>
      :root {
        color-scheme: light;
        --boot-bg: #e6dcc8;
        --boot-panel: #ebe3d2;
        --boot-line: #d5c9b2;
        --boot-skeleton: #e4d9c4;
      }
      /* 다크 계열 팔레트마다 셸 4색이 필요하다 — 없으면 그 테마 사용자는
         부팅마다 크림색 셸을 한 번 본다. boot-theme.test.ts가 등록된 테마마다
         이 블록의 존재를 강제한다. 값은 app.css의 shell / bg-panel /
         border-subtle / bg-elevated. */
      :root[data-theme='dark'] {
        color-scheme: dark;
        --boot-bg: #08080a;
        --boot-panel: #131417;
        --boot-line: #272a31;
        --boot-skeleton: #1b1d22;
      }
      :root[data-theme='ink'] {
        color-scheme: dark;
        --boot-bg: #090c11;
        --boot-panel: #131a24;
        --boot-line: #26303f;
        --boot-skeleton: #1a222e;
      }
      :root[data-theme='ember'] {
        color-scheme: dark;
        --boot-bg: #0f0901;
        --boot-panel: #201608;
        --boot-line: #362919;
        --boot-skeleton: #2a1e0f;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          color-scheme: dark;
          --boot-bg: #08080a;
          --boot-panel: #131417;
          --boot-line: #272a31;
          --boot-skeleton: #1b1d22;
        }
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--color-shell, var(--boot-bg));
        color: var(--color-text-primary, #1c1812);
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-feature-settings: 'tnum' 1;
        -webkit-font-smoothing: antialiased;
      }
      #app {
        height: 100%;
      }
      /* 셸 골격: 사이드바 + 메인. 번들 로드 전 뼈대만 먼저 그린다. */
      .boot-shell {
        display: flex;
        height: 100%;
      }
      .boot-sidebar {
        width: 272px;
        flex: 0 0 272px;
        border-right: 1px solid var(--color-border-subtle, var(--boot-line));
        background: var(--color-bg-panel, var(--boot-panel));
        padding: 16px 12px;
      }
      .boot-main {
        flex: 1;
        padding: 14px 18px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .boot-skel {
        background: var(--color-bg-elevated, var(--boot-skeleton));
        border-radius: 6px;
        animation: boot-pulse 1.2s ease-in-out infinite;
      }
      .boot-logo {
        height: 18px;
        width: 84px;
        margin-bottom: 20px;
      }
      .boot-nav {
        height: 12px;
        margin: 10px 0;
      }
      .boot-row {
        height: 42px;
      }
      @keyframes boot-pulse {
        0%,
        100% {
          opacity: 0.5;
        }
        50% {
          opacity: 0.85;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-skel {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot-shell" id="boot-shell">
        <aside class="boot-sidebar">
          <div class="boot-skel boot-logo"></div>
          <div class="boot-skel boot-nav" style="width: 70%"></div>
          <div class="boot-skel boot-nav" style="width: 55%"></div>
          <div class="boot-skel boot-nav" style="width: 62%"></div>
          <div class="boot-skel boot-nav" style="width: 48%"></div>
        </aside>
        <main class="boot-main">
          <div class="boot-skel boot-row" style="width: 40%; height: 24px"></div>
          <div class="boot-skel boot-row"></div>
          <div class="boot-skel boot-row"></div>
          <div class="boot-skel boot-row"></div>
          <div class="boot-skel boot-row"></div>
          <div class="boot-skel boot-row"></div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
