name: Bug report
description: Something in gadak behaves incorrectly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Check `specs/000-product/tasks.md` and `docs/project/STATE_OF_PLAY.md` first —
        many features are specified but not implemented yet.

        **Do not paste real issue text, API tokens, site URLs, or a database
        snapshot.** Prefer `gadak doctor` (counts and versions only — no keys,
        names, hostnames, or tokens).
  - type: textarea
    id: doctor
    attributes:
      label: gadak doctor output
      description: |
        Run `gadak doctor` (or `gadak --profile <name> doctor`) and paste the full
        output. Safe for public issues — redacts tokens, site hosts, emails,
        project keys, and custom-field names.
      placeholder: |
        # gadak doctor — safe to paste: counts and versions only, no keys, names, URLs or tokens
        ...
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: gadak version
      description: Output of `gadak version`. If that command is missing or prints `0.0.0-dev`, paste the git commit SHA instead. (Also present in `gadak doctor`.)
      placeholder: "0.1.0 or abcdef1"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      description: Operating system and architecture. (Also present in `gadak doctor`.)
      placeholder: "macOS 15 arm64 / Ubuntu 24.04 x86_64 / Windows 11 amd64"
    validations:
      required: true
  - type: dropdown
    id: jira_deployment
    attributes:
      label: Jira deployment type
      description: gadak supports **Jira Cloud only**. Server / Data Center is out of scope until someone can test it.
      options:
        - Jira Cloud
        - Jira Server / Data Center (unsupported)
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: project_style
    attributes:
      label: Jira project style
      options: [company-managed, team-managed, both, not sure]
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: Jira account display language
      description: Status and issue-type names are localized per account; this is a common cause of empty filters.
      placeholder: "English / Korean / …"
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Command(s) run, expected result, actual result. Redact keys, titles, and hostnames.
      placeholder: |
        1. gadak sync
        2. gadak sql "select …"
        Expected: …
        Actual: …
    validations:
      required: true
