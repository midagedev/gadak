name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Build web UI
        run: |
          npm ci
          npm run build
          test -d dist/app

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Write-scoped deploy key for midagedev/homebrew-tap — goreleaser pushes
          # the formula over SSH. Absent on forks, where the brews upload skips itself.
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
          # Developer ID signing + notarization. Absent on forks, where the
          # notarize block disables itself rather than failing the build.
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}

  # Refresh the in-repo AUR recipe from the tag we just published.
  # Does not push to aur.archlinux.org (account + SSH key; lead-only).
  # contrib/aur/gadak-bin/update.sh rewrites pkgver and the two linux
  # sha256sums from this tag's checksums.txt — it does not invent hashes.
  # .SRCINFO is not regenerated here: makepkg is an Arch tool. After
  # downloading the artifact, run contrib/aur/gadak-bin/verify.sh and
  # commit PKGBUILD + .SRCINFO together.
  #
  # Existing job name, asset names, and goreleaser args are untouched:
  # v0.14.0 apps read the updater zip namespace.
  aur-pkgbuild:
    name: Refresh gadak-bin PKGBUILD
    needs: goreleaser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # pkgver cannot contain a hyphen. A prerelease tag (v0.16.0-rc.1)
    # is skipped rather than failing the release.
    if: ${{ !contains(github.ref_name, '-') }}
    steps:
      - uses: actions/checkout@v4

      - name: Rewrite PKGBUILD pkgver and sha256sums from this tag
        run: ./contrib/aur/gadak-bin/update.sh "${{ github.ref_name }}"

      - name: Show the commit-ready diff
        run: git --no-pager diff -- contrib/aur/gadak-bin/PKGBUILD

      - name: Upload updated PKGBUILD
        uses: actions/upload-artifact@v4
        with:
          name: gadak-bin-pkgbuild
          path: contrib/aur/gadak-bin/PKGBUILD
          if-no-files-found: error

  # Claude Desktop extension and MCP Registry entry (GDK-1822).
  # tools/mcpb/build.sh repacks this tag's darwin and windows archives (the
  # binaries goreleaser just published) into gadak-<ver>.mcpb and writes
  # server.json with that file's sha256. macOS runner: lipo, codesign, sips.
  #
  # The .mcpb is attached on every tag. Install, check, login and publish run
  # only when the repository variable MCP_REGISTRY_PUBLISH is 'true'.
  #
  # Do not re-run this job after a registry publish. mcpb pack stamps the
  # current time into the ZIP, so a rebuild has a new sha256; --clobber
  # replaces the asset, the registry keeps the old fileSha256, and clients
  # check that hash before installing. Cut a new tag instead.
  mcpb:
    name: Claude Desktop extension (.mcpb)
    needs: goreleaser
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    env:
      # Pinned; bump both together. The sha256 is the darwin_arm64 line of
      # registry_1.8.1_checksums.txt on that release.
      MCP_PUBLISHER_VERSION: v1.8.1
      MCP_PUBLISHER_SHA256: e45e520892460732a4bdf37255576415d4a53ec171f8b913faf15bb1aef7cb77
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install jsonschema for the server.json schema check
        # Optional: without it build.sh still runs the registry-constraint
        # check and prints that the full schema validation did not run.
        continue-on-error: true
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet jsonschema==4.25.1
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Build .mcpb and server.json
        run: bash tools/mcpb/build.sh "${GITHUB_REF_NAME}" out

      - name: Keep server.json with the run
        uses: actions/upload-artifact@v4
        with:
          name: mcpb-server-json
          path: out/server.json
          if-no-files-found: error

      - name: Attach .mcpb to the release
        run: gh release upload "${GITHUB_REF_NAME}" out/gadak-*.mcpb --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install mcp-publisher
        if: vars.MCP_REGISTRY_PUBLISH == 'true'
        run: |
          if [[ "$(uname -m)" != "arm64" ]]; then
            echo "pinned mcp-publisher asset is darwin_arm64; this runner is $(uname -m)" >&2
            exit 1
          fi
          curl -fsSL -o "$RUNNER_TEMP/mcp-publisher.tar.gz" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_darwin_arm64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  $RUNNER_TEMP/mcp-publisher.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher

      - name: Check the asset answers the registry's HEAD request
        if: vars.MCP_REGISTRY_PUBLISH == 'true'
        # The registry HEADs the identifier without following redirects and
        # accepts 200, or a 3xx that carries a Location.
        run: |
          url="$(python3 -c 'import json; print(json.load(open("out/server.json"))["packages"][0]["identifier"])')"
          read -r code location < <(curl -s -o /dev/null -I -w '%{http_code} %{redirect_url}\n' "$url")
          echo "HEAD $url -> $code ${location:-}"
          if [[ "$code" == "200" ]]; then exit 0; fi
          if [[ "$code" == 3* && -n "${location:-}" ]]; then exit 0; fi
          echo "release asset is not publicly reachable yet" >&2
          exit 1

      - name: Log in to the MCP Registry (GitHub OIDC)
        if: vars.MCP_REGISTRY_PUBLISH == 'true'
        run: '"$RUNNER_TEMP/mcp-publisher" login github-oidc'

      - name: Publish server.json
        if: vars.MCP_REGISTRY_PUBLISH == 'true'
        run: '"$RUNNER_TEMP/mcp-publisher" publish out/server.json'
