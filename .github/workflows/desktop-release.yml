name: Desktop release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop-macos:
    name: macOS app + dmg
    runs-on: macos-14
    timeout-minutes: 45
    env:
      # `secrets` is not a valid context in step-level `if`; evaluate here.
      HAS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 != '' }}
      HAS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY != '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Build web UI
        run: |
          npm ci
          npm run build
          test -d dist/app

      # Developer ID p12 + notary API key. Absent on forks — signing/notarization
      # self-disable and the job still succeeds with an unsigned dmg.
      - name: Import signing certificate
        if: env.HAS_SIGN_P12 == 'true'
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/gadak-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$MACOS_SIGN_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -P "$MACOS_SIGN_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychain -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep 'Developer ID Application' | head -1 \
            | sed -E 's/.*"([^"]+)".*/\1/')"
          if [[ -z "$IDENTITY" ]]; then
            echo "no Developer ID Application identity in imported p12" >&2
            exit 1
          fi
          echo "GADAK_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "imported signing identity (name redacted)"

      - name: Prepare notarization key
        if: env.HAS_NOTARY_KEY == 'true'
        env:
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          # The secret is stored base64-encoded (what goreleaser/quill consume);
          # accept raw PEM too so a rotated secret in either shape keeps working.
          if printf '%s' "$MACOS_NOTARY_KEY" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s\n' "$MACOS_NOTARY_KEY" > "$KEY_PATH"
          else
            printf '%s' "$MACOS_NOTARY_KEY" | base64 --decode > "$KEY_PATH"
            grep -q 'BEGIN PRIVATE KEY' "$KEY_PATH" || {
              echo "MACOS_NOTARY_KEY is neither PEM nor base64-encoded PEM" >&2
              exit 1
            }
          fi
          chmod 600 "$KEY_PATH"
          {
            echo "GADAK_NOTARY_KEY=$KEY_PATH"
            echo "GADAK_NOTARY_KEY_ID=$MACOS_NOTARY_KEY_ID"
            echo "GADAK_NOTARY_ISSUER_ID=$MACOS_NOTARY_ISSUER_ID"
          } >> "$GITHUB_ENV"

      - name: Build Gadak.app + dmg
        run: desktop/build-app.sh --dmg

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: gadak-desktop-dmg
          path: |
            desktop/build/Gadak-*.dmg
            desktop/build/gadak-desktop-darwin-arm64.zip
            desktop/build/SHA256SUMS
          if-no-files-found: error

      - name: Attach dmg to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          shopt -s nullglob
          dmgs=(desktop/build/Gadak-*.dmg)
          if [[ ${#dmgs[@]} -eq 0 ]]; then
            echo "no dmg produced" >&2
            exit 1
          fi
          # The in-app updater consumes the zip (its name carries GOOS+GOARCH
          # for the default asset matcher) and SHA256SUMS for digest checks;
          # the dmg stays the human install path. build-app.sh --dmg makes all
          # three, after notarization so the zip carries the stapled bundle.
          assets=("${dmgs[@]}")
          for f in desktop/build/gadak-desktop-darwin-arm64.zip desktop/build/SHA256SUMS; do
            if [[ -f "$f" ]]; then
              assets+=("$f")
            else
              echo "missing updater asset $f" >&2
              exit 1
            fi
          done
          # The goreleaser job creates the Release; wait so we attach rather
          # than race-create. Fall back to creating a shell release if the
          # other job never appears (e.g. disabled on a fork).
          for i in $(seq 1 60); do
            if gh release view "$tag" >/dev/null 2>&1; then
              break
            fi
            echo "waiting for release $tag ($i/60)…"
            sleep 10
          done
          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag not found after wait — creating shell release for the dmg"
            gh release create "$tag" --title "$tag" --generate-notes
          fi
          gh release upload "$tag" "${assets[@]}" --clobber

      # `brew install midagedev/tap/gadak` is the app (decided 2026-08-15):
      # this step renders the cask from the notarized dmg and pushes it to the
      # tap with the same deploy key the goreleaser formula uses. The CLI-only
      # formula is gadak-cli (.goreleaser.yaml). Skipped without the key
      # (forks) and on prerelease tags, matching the formula's skip_upload.
      - name: Publish Homebrew cask
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if [[ -z "${TAP_DEPLOY_KEY:-}" ]]; then
            echo "no TAP_DEPLOY_KEY — skipping cask publish (fork build)"
            exit 0
          fi
          if [[ "$tag" == *-* ]]; then
            echo "prerelease tag $tag — skipping cask publish"
            exit 0
          fi
          version="${tag#v}"
          dmg="desktop/build/Gadak-${version}-arm64.dmg"
          if [[ ! -f "$dmg" ]]; then
            echo "dmg $dmg not found — tag/build version mismatch" >&2
            exit 1
          fi
          sha256=$(shasum -a 256 "$dmg" | awk '{print $1}')
          cat > /tmp/gadak.rb <<EOF
          cask "gadak" do
            version "${version}"
            sha256 "${sha256}"

            url "https://github.com/midagedev/gadak/releases/download/v#{version}/Gadak-#{version}-arm64.dmg"
            name "Gadak"
            desc "Your Jira and Confluence in one local SQLite file - app, web UI, agent SQL/MCP"
            homepage "https://github.com/midagedev/gadak"

            depends_on arch: :arm64
            depends_on macos: :monterey

            app "Gadak.app"
            # The bundle carries the CLI; this puts it on PATH, so the app
            # install is also the CLI install. Conflicts with the gadak-cli
            # formula's bin/gadak - install one or the other.
            binary "#{appdir}/Gadak.app/Contents/Resources/bin/gadak"
          end
          EOF
          eval "$(ssh-agent -s)"
          ssh-add - <<< "$TAP_DEPLOY_KEY"
          export GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:midagedev/homebrew-tap.git /tmp/tap
          mkdir -p /tmp/tap/Casks
          cp /tmp/gadak.rb /tmp/tap/Casks/gadak.rb
          # Gate before pushing: a cask that does not pass style must fail the
          # job, not land in the tap. brew style rejects files outside a tap,
          # so link the clone in as the real tap first (measured locally).
          mkdir -p "$(brew --repository)/Library/Taps/midagedev"
          ln -sfn /tmp/tap "$(brew --repository)/Library/Taps/midagedev/homebrew-tap"
          brew style --cask "$(brew --repository)/Library/Taps/midagedev/homebrew-tap/Casks/gadak.rb"
          cd /tmp/tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/gadak.rb
          if git diff --cached --quiet; then
            echo "cask unchanged — nothing to push"
            exit 0
          fi
          git commit -m "gadak cask ${tag}"
          git push origin HEAD
