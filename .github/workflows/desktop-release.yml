name: Desktop release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop-macos:
    name: macOS app + dmg
    runs-on: macos-14
    timeout-minutes: 45
    env:
      # `secrets` is not a valid context in step-level `if`; evaluate here.
      HAS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 != '' }}
      HAS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY != '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Build web UI
        run: |
          npm ci
          npm run build
          test -d dist/app

      # Developer ID p12 + notary API key. Absent on forks — signing/notarization
      # self-disable and the job still succeeds with an unsigned dmg.
      - name: Import signing certificate
        if: env.HAS_SIGN_P12 == 'true'
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/scry-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$MACOS_SIGN_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -P "$MACOS_SIGN_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychain -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep 'Developer ID Application' | head -1 \
            | sed -E 's/.*"([^"]+)".*/\1/')"
          if [[ -z "$IDENTITY" ]]; then
            echo "no Developer ID Application identity in imported p12" >&2
            exit 1
          fi
          echo "SCRY_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "imported signing identity (name redacted)"

      - name: Prepare notarization key
        if: env.HAS_NOTARY_KEY == 'true'
        env:
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          # The secret is stored base64-encoded (what goreleaser/quill consume);
          # accept raw PEM too so a rotated secret in either shape keeps working.
          if printf '%s' "$MACOS_NOTARY_KEY" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s\n' "$MACOS_NOTARY_KEY" > "$KEY_PATH"
          else
            printf '%s' "$MACOS_NOTARY_KEY" | base64 --decode > "$KEY_PATH"
            grep -q 'BEGIN PRIVATE KEY' "$KEY_PATH" || {
              echo "MACOS_NOTARY_KEY is neither PEM nor base64-encoded PEM" >&2
              exit 1
            }
          fi
          chmod 600 "$KEY_PATH"
          {
            echo "SCRY_NOTARY_KEY=$KEY_PATH"
            echo "SCRY_NOTARY_KEY_ID=$MACOS_NOTARY_KEY_ID"
            echo "SCRY_NOTARY_ISSUER_ID=$MACOS_NOTARY_ISSUER_ID"
          } >> "$GITHUB_ENV"

      - name: Build Scry.app + dmg
        run: desktop/build-app.sh --dmg

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: scry-desktop-dmg
          path: desktop/build/Scry-*.dmg
          if-no-files-found: error

      - name: Attach dmg to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          shopt -s nullglob
          dmgs=(desktop/build/Scry-*.dmg)
          if [[ ${#dmgs[@]} -eq 0 ]]; then
            echo "no dmg produced" >&2
            exit 1
          fi
          # The goreleaser job creates the Release; wait so we attach rather
          # than race-create. Fall back to creating a shell release if the
          # other job never appears (e.g. disabled on a fork).
          for i in $(seq 1 60); do
            if gh release view "$tag" >/dev/null 2>&1; then
              break
            fi
            echo "waiting for release $tag ($i/60)…"
            sleep 10
          done
          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag not found after wait — creating shell release for the dmg"
            gh release create "$tag" --title "$tag" --generate-notes
          fi
          gh release upload "$tag" "${dmgs[@]}" --clobber
