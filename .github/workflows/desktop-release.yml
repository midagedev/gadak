name: Desktop release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop-macos:
    name: macOS app + dmg
    runs-on: macos-14
    timeout-minutes: 45
    env:
      # `secrets` is not a valid context in step-level `if`; evaluate here.
      HAS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 != '' }}
      HAS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY != '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Build web UI
        run: |
          npm ci
          npm run build
          test -d dist/app

      # Developer ID p12 + notary API key. Absent on forks — signing/notarization
      # self-disable and the job still succeeds with an unsigned dmg.
      - name: Import signing certificate
        if: env.HAS_SIGN_P12 == 'true'
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/gadak-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$MACOS_SIGN_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -P "$MACOS_SIGN_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychain -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep 'Developer ID Application' | head -1 \
            | sed -E 's/.*"([^"]+)".*/\1/')"
          if [[ -z "$IDENTITY" ]]; then
            echo "no Developer ID Application identity in imported p12" >&2
            exit 1
          fi
          echo "GADAK_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "imported signing identity (name redacted)"

      - name: Prepare notarization key
        if: env.HAS_NOTARY_KEY == 'true'
        env:
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          # The secret is stored base64-encoded (what goreleaser/quill consume);
          # accept raw PEM too so a rotated secret in either shape keeps working.
          if printf '%s' "$MACOS_NOTARY_KEY" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s\n' "$MACOS_NOTARY_KEY" > "$KEY_PATH"
          else
            printf '%s' "$MACOS_NOTARY_KEY" | base64 --decode > "$KEY_PATH"
            grep -q 'BEGIN PRIVATE KEY' "$KEY_PATH" || {
              echo "MACOS_NOTARY_KEY is neither PEM nor base64-encoded PEM" >&2
              exit 1
            }
          fi
          chmod 600 "$KEY_PATH"
          {
            echo "GADAK_NOTARY_KEY=$KEY_PATH"
            echo "GADAK_NOTARY_KEY_ID=$MACOS_NOTARY_KEY_ID"
            echo "GADAK_NOTARY_ISSUER_ID=$MACOS_NOTARY_ISSUER_ID"
          } >> "$GITHUB_ENV"

      - name: Build Gadak.app + dmg
        run: desktop/build-app.sh --dmg

      # Recurrence gate (notify-only decision 2026-08-15, GDK-58/59/60/61/64):
      # v0.14.0 apps match gadak-desktop-darwin-<arch>.zip exactly and would
      # self-swap if that name reappears. The dmg is the only install path.
      # desktop/ must not reimport wails/v3/pkg/updater.
      - name: Notify-only — no updater zip, no wails updater import
        run: |
          set -euo pipefail
          if grep -n 'wails/v3/pkg/updater' desktop/*.go; then
            echo "desktop/ reimports wails/v3/pkg/updater" >&2
            exit 1
          fi
          shopt -s nullglob
          zips=(desktop/build/*.zip)
          if [[ ${#zips[@]} -ne 0 ]]; then
            echo "desktop/build contains zip(s); notify-only releases must not ship one:" >&2
            printf '%s\n' "${zips[@]}" >&2
            exit 1
          fi

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: gadak-desktop-dmg
          path: |
            desktop/build/Gadak-*.dmg
          if-no-files-found: error

      - name: Attach dmg to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          shopt -s nullglob
          dmgs=(desktop/build/Gadak-*.dmg)
          if [[ ${#dmgs[@]} -eq 0 ]]; then
            echo "no dmg produced" >&2
            exit 1
          fi
          # Notify-only (decision 2026-08-15): the dmg is the only install
          # path. v0.14.0 apps match gadak-desktop-darwin-<arch>.zip exactly;
          # this release must not ship that name so they cannot self-swap.
          assets=("${dmgs[@]}")
          # The goreleaser job creates the Release; wait so we attach rather
          # than race-create. Fall back to creating a shell release if the
          # other job never appears (e.g. disabled on a fork).
          for i in $(seq 1 60); do
            if gh release view "$tag" >/dev/null 2>&1; then
              break
            fi
            echo "waiting for release $tag ($i/60)…"
            sleep 10
          done
          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag not found after wait — creating shell release for the dmg"
            gh release create "$tag" --title "$tag" --generate-notes
          fi
          gh release upload "$tag" "${assets[@]}" --clobber

      # `brew install midagedev/tap/gadak` is the app (decided 2026-08-15):
      # this step renders the cask from the notarized dmg and pushes it to the
      # tap with the same deploy key the goreleaser formula uses. The CLI-only
      # formula is gadak-cli (.goreleaser.yaml). Skipped without the key
      # (forks) and on prerelease tags, matching the formula's skip_upload.
      - name: Publish Homebrew cask
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if [[ -z "${TAP_DEPLOY_KEY:-}" ]]; then
            echo "no TAP_DEPLOY_KEY — skipping cask publish (fork build)"
            exit 0
          fi
          if [[ "$tag" == *-* ]]; then
            echo "prerelease tag $tag — skipping cask publish"
            exit 0
          fi
          version="${tag#v}"
          dmg="desktop/build/Gadak-${version}-arm64.dmg"
          if [[ ! -f "$dmg" ]]; then
            echo "dmg $dmg not found — tag/build version mismatch" >&2
            exit 1
          fi
          sha256=$(shasum -a 256 "$dmg" | awk '{print $1}')
          cat > /tmp/gadak.rb <<EOF
          cask "gadak" do
            version "${version}"
            sha256 "${sha256}"

            url "https://github.com/midagedev/gadak/releases/download/v#{version}/Gadak-#{version}-arm64.dmg"
            name "Gadak"
            desc "Your Jira and Confluence in one local SQLite file - app, web UI, agent SQL/MCP"
            homepage "https://github.com/midagedev/gadak"

            depends_on arch: :arm64
            depends_on macos: :monterey

            app "Gadak.app"
            # The bundle carries the CLI; this puts it on PATH, so the app
            # install is also the CLI install. Conflicts with the gadak-cli
            # formula's bin/gadak - install one or the other.
            binary "#{appdir}/Gadak.app/Contents/Resources/bin/gadak"
          end
          EOF
          eval "$(ssh-agent -s)"
          ssh-add - <<< "$TAP_DEPLOY_KEY"
          export GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:midagedev/homebrew-tap.git /tmp/tap
          mkdir -p /tmp/tap/Casks
          cp /tmp/gadak.rb /tmp/tap/Casks/gadak.rb
          # Gate before pushing: a cask that does not pass style must fail the
          # job, not land in the tap. brew style rejects files outside a tap,
          # so link the clone in as the real tap first (measured locally).
          mkdir -p "$(brew --repository)/Library/Taps/midagedev"
          ln -sfn /tmp/tap "$(brew --repository)/Library/Taps/midagedev/homebrew-tap"
          brew style --cask "$(brew --repository)/Library/Taps/midagedev/homebrew-tap/Casks/gadak.rb"
          cd /tmp/tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/gadak.rb
          if git diff --cached --quiet; then
            echo "cask unchanged — nothing to push"
            exit 0
          fi
          git commit -m "gadak cask ${tag}"
          # The formula (goreleaser, Release workflow) and this cask land in
          # the same tap on every tag, and the two workflows race: v0.15.0's
          # cask push was rejected non-fast-forward seconds after the formula
          # landed (run 32006831707). The two writers touch different files
          # (Formula/ vs Casks/), so rebase onto the moving tip and retry.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD; then
              exit 0
            fi
            echo "push rejected (attempt $attempt) — rebasing onto the tap tip"
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 3))
          done
          echo "cask push failed after 5 attempts" >&2
          exit 1

  # Unsigned Windows portable zip. No certificate in 0.16 (GDK-211), so this
  # job never looks for one. An installer would add SmartScreen/SAC friction
  # without making the bytes more trustworthy, so the asset is a zip of the
  # directory desktop/build-windows.ps1 already builds.
  desktop-windows:
    name: Windows app + zip
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Build web UI
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath dist/app)) { throw "dist/app missing" }

      # --msix adds the unsigned Store package next to each zip (GDK-1380).
      # It is a workflow artifact only, never a Release asset: unsigned, it
      # is not installable, and the Store re-signs it after certification.
      - name: Pack Windows portable zips and Store packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./desktop/build-windows.ps1 --arch x64 --archive --msix
          ./desktop/build-windows.ps1 --arch arm64 --archive --msix

      # Recurrence gate (same decision as the macOS job, 2026-08-15):
      # v0.14.0 apps match gadak-desktop-<os>-<arch>.zip exactly and would
      # self-swap. The Windows asset is Gadak-<ver>-windows-<x64|arm64>.zip
      # so it cannot be that name (different prefix, version in the middle,
      # pack label x64 not amd64). It also cannot collide with the CLI zip
      # gadak_<ver>_windows_<amd64|arm64>.zip from goreleaser.
      - name: Notify-only — no updater zip name
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bad = @(Get-ChildItem -Path desktop/build -File -Filter 'gadak-desktop-*.zip' -ErrorAction SilentlyContinue)
          if ($bad.Count -ne 0) {
            Write-Host 'desktop/build contains zip(s) in the updater namespace:'
            $bad | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
          $zips = @(Get-ChildItem -Path desktop/build -File -Filter 'Gadak-*-windows-*.zip')
          if ($zips.Count -eq 0) {
            Write-Host 'no Gadak-*-windows-*.zip produced'
            exit 1
          }
          foreach ($exe in @('gadak-desktop.exe', 'gadak.exe')) {
            $hits = @(Get-ChildItem -Path desktop/build -Recurse -File -Filter $exe)
            if ($hits.Count -eq 0) {
              Write-Host "packed tree is missing $exe"
              exit 1
            }
          }
          Write-Host ("windows assets: {0}" -f ($zips.Name -join ', '))

      - name: Upload Windows zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: gadak-desktop-windows
          path: |
            desktop/build/Gadak-*-windows-*.zip
          if-no-files-found: error

      # For the maintainer to download and submit in Partner Center. The
      # Release step below filters on *.zip and never sees these.
      - name: Upload Store package artifact (unsigned msix)
        uses: actions/upload-artifact@v4
        with:
          name: gadak-desktop-msix
          path: |
            desktop/build/Gadak-*-windows-*.msix
          if-no-files-found: error

      - name: Attach zip to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $tag = $env:GITHUB_REF_NAME
          $zips = @(Get-ChildItem -Path desktop/build -File -Filter 'Gadak-*-windows-*.zip')
          if ($zips.Count -eq 0) {
            Write-Host 'no Windows zip produced' -ForegroundColor Red
            exit 1
          }
          foreach ($z in $zips) {
            if ($z.Name -like 'gadak-desktop-*.zip') {
              Write-Host ("refusing to upload {0}: v0.14.0 apps match gadak-desktop-<os>-<arch>.zip" -f $z.Name)
              exit 1
            }
          }
          $found = $false
          foreach ($i in 1..60) {
            gh release view $tag 1>$null 2>$null
            if ($LASTEXITCODE -eq 0) {
              $found = $true
              break
            }
            Write-Host "waiting for release $tag ($i/60)…"
            Start-Sleep -Seconds 10
          }
          if (-not $found) {
            Write-Host "release $tag not found after wait — creating shell release for the zip"
            gh release create $tag --title $tag --generate-notes
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          $paths = @($zips | ForEach-Object { $_.FullName })
          gh release upload $tag @paths --clobber
          if ($LASTEXITCODE -ne 0) { exit 1 }
