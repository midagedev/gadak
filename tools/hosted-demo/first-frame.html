<div
  id="gadak-first-frame"
  class="gadak-ff"
  data-testid="hosted-first-frame"
  role="dialog"
  aria-modal="true"
  aria-labelledby="gadak-ff-claim"
>
  <style>
    .gadak-ff {
      --ff-bg: #e6dcc8;
      --ff-page: #f4efe4;
      --ff-panel: #ebe3d2;
      --ff-ink: #1c1812;
      --ff-muted: #534c42;
      --ff-line: #d5c9b2;
      --ff-accent: #2e4560;
      --ff-accent-hover: #24384e;
      --ff-paper: #f4efe4;
      --ff-sans:
        -apple-system, BlinkMacSystemFont, system-ui, 'Apple SD Gothic Neo', 'Noto Sans CJK KR',
        'Noto Sans KR', 'Malgun Gothic', 'Segoe UI', sans-serif;
      --ff-display:
        'New York', 'Apple SD Gothic Neo', 'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic',
        'Iowan Old Style', ui-serif, Palatino, Georgia, serif;
      --ff-mono:
        ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono',
        'Apple SD Gothic Neo', 'Noto Sans CJK KR', 'Malgun Gothic', monospace;
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 36px;
      overflow: auto;
      background: var(--ff-bg);
      color: var(--ff-ink);
      font-family: var(--ff-sans);
      -webkit-font-smoothing: antialiased;
    }
    .gadak-ff *,
    .gadak-ff *::before,
    .gadak-ff *::after {
      box-sizing: border-box;
    }
    .gadak-ff-inner {
      width: min(980px, 100%);
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 16px;
    }
    .gadak-ff-claim {
      margin: 0;
      font-family: var(--ff-display);
      font-size: 44px;
      font-weight: 600;
      line-height: 1.22;
      letter-spacing: -0.01em;
      color: var(--ff-ink);
    }
    .gadak-ff-stage {
      position: relative;
      width: 100%;
      max-height: 200px;
      aspect-ratio: 1024 / 640;
      overflow: hidden;
      border: 1px solid var(--ff-line);
      border-radius: 8px;
      background: var(--ff-panel);
      box-shadow:
        0 18px 48px rgb(40 28 12 / 0.16),
        0 4px 12px rgb(40 28 12 / 0.08);
    }
    @media (min-height: 1400px) {
      .gadak-ff {
        align-items: flex-start;
        padding-top: 80px;
      }
      .gadak-ff-stage {
        max-height: 520px;
      }
    }
    .gadak-ff-play {
      position: absolute;
      inset: 0;
      display: block;
      padding: 0;
      border: 0;
      cursor: pointer;
      background: transparent;
    }
    .gadak-ff-play img,
    .gadak-ff-stage video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .gadak-ff-playmark {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ff-paper);
      font-size: 56px;
      line-height: 1;
      text-indent: 6px;
      background: rgb(28 24 18 / 0.28);
    }
    .gadak-ff-playmark span {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 112px;
      height: 112px;
      border-radius: 50%;
      background: var(--ff-accent);
    }
    .gadak-ff-brew {
      margin: 0;
      padding: 16px 20px;
      border: 1px solid var(--ff-line);
      border-radius: 6px;
      background: var(--ff-panel);
      color: var(--ff-ink);
      font-family: var(--ff-mono);
      font-size: 42px;
      line-height: 1.3;
      user-select: all;
      -webkit-user-select: all;
      cursor: text;
      overflow-x: auto;
      white-space: nowrap;
    }
    .gadak-ff-repo {
      color: var(--ff-accent);
      font-size: 36px;
      line-height: 1.3;
      text-decoration: underline;
      text-underline-offset: 6px;
    }
    .gadak-ff-open {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      align-self: flex-start;
      min-height: 88px;
      padding: 0 36px;
      border: 0;
      border-radius: 6px;
      background: var(--ff-accent);
      color: var(--ff-paper);
      font-family: var(--ff-sans);
      font-size: 36px;
      font-weight: 600;
      line-height: 1;
      cursor: pointer;
    }
    .gadak-ff-open:hover,
    .gadak-ff-play:hover .gadak-ff-playmark span {
      background: var(--ff-accent-hover);
    }
  </style>
  <div class="gadak-ff-inner">
    <p id="gadak-ff-claim" class="gadak-ff-claim" data-testid="hosted-first-frame-claim">
      A local SQLite file of your Jira — so "which epic is stuck?" is one query, not an unaskable one.
    </p>
    <div class="gadak-ff-stage">
      <button
        type="button"
        id="gadak-ff-play"
        class="gadak-ff-play"
        data-testid="hosted-first-frame-play"
        aria-label="Play keyboard-triage demo"
      >
        <img
          id="gadak-ff-poster"
          src="web-demo-poster.jpg"
          width="1024"
          height="640"
          alt=""
        />
        <span class="gadak-ff-playmark" aria-hidden="true"><span>▶</span></span>
      </button>
      <video
        id="gadak-ff-video"
        data-testid="hosted-first-frame-video"
        preload="none"
        playsinline
        hidden
      ></video>
    </div>
    <pre class="gadak-ff-brew" data-testid="hosted-first-frame-brew">brew install midagedev/tap/gadak</pre>
    <a class="gadak-ff-repo" href="https://github.com/midagedev/gadak">https://github.com/midagedev/gadak</a>
    <button type="button" id="gadak-ff-open" class="gadak-ff-open" data-testid="hosted-first-frame-open">
      Open the demo
    </button>
  </div>
  <script>
    (function () {
      var frame = document.getElementById('gadak-first-frame')
      var app = document.getElementById('app')
      var open = document.getElementById('gadak-ff-open')
      var play = document.getElementById('gadak-ff-play')
      var video = document.getElementById('gadak-ff-video')
      if (app) app.setAttribute('aria-hidden', 'true')
      if (open) {
        open.addEventListener('click', function () {
          if (frame && frame.parentNode) frame.parentNode.removeChild(frame)
          if (app) app.removeAttribute('aria-hidden')
        })
      }
      if (play && video) {
        play.addEventListener('click', function () {
          video.src = 'web-demo.mp4'
          video.setAttribute('controls', '')
          play.hidden = true
          video.hidden = false
          var p = video.play()
          if (p && p.catch) p.catch(function () {})
        })
      }
    })()
  </script>
</div>
